<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>چت‌بات هوشمند | AI Chat Bot</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div id="app">

  <!-- ═══════════════ Sidebar: conversation history ═══════════════ -->
  <aside id="sidebar">
    <div class="side-head">
      <div class="brand">
        <span class="brand-logo">🤖</span>
        <span class="brand-name" data-i18n="app_title">چت‌بات هوشمند</span>
      </div>
      <button id="sideClose" class="icon-btn" title="بستن" aria-label="close sidebar">✕</button>
    </div>

    <button id="newChatBtn" class="new-chat-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span data-i18n="new_chat">گفتگوی جدید</span>
    </button>

    <div class="side-label" data-i18n="conversations">گفتگوها</div>
    <nav id="convList" class="conv-list"></nav>

    <div class="side-foot">
      <div class="foot-line" data-i18n="footer_note">قدرت‌گرفته از Ollama + Gemma 3 • کاملاً محلی و رایگان</div>
    </div>
  </aside>
  <div id="backdrop"></div>

  <!-- ═══════════════ Main area ═══════════════ -->
  <main id="main">

    <header id="topbar">
      <button id="sideOpen" class="icon-btn" aria-label="open sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>

      <div class="status-wrap">
        <span id="statusDot" class="status-dot" title=""></span>
        <span id="statusText" class="status-text">…</span>
      </div>

      <div class="spacer"></div>

      <!-- Export: xlsx / docx / pdf / pptx -->
      <div class="export-wrap">
        <button id="exportBtn" class="icon-btn" aria-haspopup="true" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
        </button>
        <div id="exportMenu" class="export-menu hidden">
          <button class="export-item" data-x="xlsx"><span class="xi">📊</span><span data-i18n="export_xlsx">اکسل (Excel)</span></button>
          <button class="export-item" data-x="docx"><span class="xi">📄</span><span data-i18n="export_docx">وورد (Word)</span></button>
          <button class="export-item" data-x="pdf"><span class="xi">🖨️</span><span data-i18n="export_pdf">PDF (چاپ)</span></button>
          <button class="export-item" data-x="pptx"><span class="xi">📽️</span><span data-i18n="export_pptx">پاورپوینت</span></button>
        </div>
      </div>

      <label class="model-wrap" for="modelSel">
        <span data-i18n="model_label">مدل</span>
        <select id="modelSel" title="model"></select>
      </label>

      <button id="langBtn" class="lang-btn" title="Change language">EN</button>
    </header>

    <div id="banner" class="banner hidden"></div>

    <div id="chat"></div>

    <footer id="composer">
      <div id="attachBar" class="attach-bar hidden"></div>
      <div class="composer-box">
        <button id="attachBtn" class="attach-btn" title="پیوست فایل" aria-label="attach file">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <input id="fileInput" type="file" multiple hidden
               accept=".txt,.md,.markdown,.csv,.tsv,.json,.js,.mjs,.ts,.py,.css,.scss,.xml,.yaml,.yml,.html,.htm,.svg,.log,.ini,.conf,.sh,.bat,.ps1,.c,.cpp,.h,.java,.cs,.go,.rb,.php,.sql,.tex,.srt,.vtt,.png,.jpg,.jpeg,.webp,.bmp,.gif">
        <textarea id="input" rows="1" placeholder="پیام خود را بنویسید… (Enter برای ارسال)" autofocus></textarea>
        <button id="sendBtn" class="send-btn" title="ارسال" aria-label="send">
          <svg id="sendIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg>
          <span id="stopIcon" class="hidden">■</span>
        </button>
      </div>
      <div class="composer-note" data-i18n="disclaimer">مدل به‌صورت محلی اجرا می‌شود؛ پاسخ‌ها را حتماً بررسی کنید.</div>
    </footer>

  </main>
</div>

<!-- ═══════════════ HTML preview modal ("Run HTML") ═══════════════ -->
<div id="previewModal" class="preview-modal hidden" role="dialog" aria-modal="true">
  <div class="preview-card">
    <div class="preview-head">
      <span id="previewTitle" data-i18n="preview_title">پیش‌نمایش HTML</span>
      <div class="preview-actions">
        <button id="previewOpenTab" class="mini-btn" title="باز کردن در تب جدید">↗</button>
        <button id="previewClose" class="mini-btn" title="بستن">✕</button>
      </div>
    </div>
    <iframe id="previewFrame" class="preview-frame" sandbox="allow-scripts allow-modals allow-forms allow-popups" title="HTML preview"></iframe>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<!-- Local vendor libs (no CDN — works offline / sanctioned networks) -->
<script src="{{ url_for('static', filename='vendor/marked.min.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/purify.min.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/xlsx.full.min.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/docx.umd.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/pptxgen.bundle.js') }}"></script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
